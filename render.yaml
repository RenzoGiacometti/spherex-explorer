# Despliegue publico en Render (https://render.com) a partir del Dockerfile de la raiz.
# Un solo servicio web: API, frontend compilado y campos precalculados. Los campos nuevos
# se arman contra IRSA dentro de este mismo proceso, asi que tiene que ser una sola instancia.
services:
  - type: web
    name: spherex-explorer
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 2 GB de memoria. Oregon es la region mas cercana a IRSA (Caltech, California).
    plan: standard
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    # Disco persistente para la cache: los campos que arman los visitantes y los recortes
    # bajados sobreviven a un redeploy. Con disco, Render detiene la instancia vieja antes de
    # arrancar la nueva (un corte breve en cada deploy). Si el usuario del contenedor (uid 1000)
    # no pudiera escribir en el disco, el backend usa una carpeta temporal y lo deja en el log.
    disk:
      name: spherex-cache
      mountPath: /app/cache
      sizeGB: 5
    envVars:
      - key: PORT
        value: "7860"
      # Trabajos que arman campos a la vez y campos en espera (los valores del Dockerfile).
      - key: SPHEREX_MAX_ACTIVE_JOBS
        value: "2"
      - key: SPHEREX_MAX_QUEUED_JOBS
        value: "10"
      # Descargas en paralelo contra IRSA. Con 10 responde "503 Server busy" a buena parte de
      # los pedidos; con 4 responde bien.
      - key: SPHEREX_MAX_CUTOUT_DOWNLOADS
        value: "4"
      # De donde salen los pixeles de un recorte (backend/app/config.py, `cutout_source`).
      # `auto`: del servicio de recortes de IRSA y, si responde ocupado o se corta, del
      # bucket publico de AWS en el mismo intento. `irsa` vuelve al comportamiento anterior:
      # solo el servicio de recortes, esperando el Retry-After.
      - key: SPHEREX_CUTOUT_SOURCE
        value: auto
      # Con 1, las colecciones que se listan salen de las carpetas del bucket publico de AWS
      # (`discover_releases`). Con 0 vale la lista fija: spherex_dr1 y spherex_qr3.
      - key: SPHEREX_DISCOVER_RELEASES
        value: "1"
