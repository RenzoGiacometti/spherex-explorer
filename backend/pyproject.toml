[project]
name = "spherex-backend"
version = "0.1.0"
description = "Backend de SPHEREx Explorer: arma el cubo del campo y lo sirve (FastAPI + astropy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "fastapi>=0.163.0",
    "numpy>=2.5.4",
    "pydantic>=2",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
# El backend es una aplicacion, no un paquete instalable: se corre desde backend/.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
